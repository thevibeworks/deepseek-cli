version: 2

project_name: deepseek-cli

before:
  hooks:
    - go mod tidy

builds:
  - id: deepseek
    main: ./cmd/deepseek
    binary: deepseek
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}

  # The free-tier gateway. A separate Go module, hence `dir`, and Linux
  # only: it is a server, and nobody is running one from a laptop except
  # to test it -- for which `make gateway` is right there.
  - id: dsgate
    dir: gateway
    main: ./cmd/dsgate
    binary: dsgate
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: default
    ids: [deepseek]
    # deepseek_darwin_arm64.tar.gz — the names the README's curl lines use.
    name_template: "deepseek_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - AGENTS.md
      - skill/SKILL.md

  - id: gateway
    ids: [dsgate]
    name_template: "dsgate_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - LICENSE
      - src: gateway/DESIGN.md
        dst: DESIGN.md
      - src: gateway/deploy/README.md
        dst: DEPLOY.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"

release:
  # Re-pushing a tag re-runs this workflow, and without it goreleaser
  # fails on the first asset with "already_exists" -- leaving a red X on
  # a release that is actually fine. Happened once, when v0.1.0 was
  # re-tagged to correct its tagger identity.
  replace_existing_artifacts: true
  footer: |
    ---
    ```bash
    go install github.com/thevibeworks/deepseek-cli/cmd/deepseek@{{ .Tag }}
    ```
