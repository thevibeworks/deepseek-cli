name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { echo "needs gofmt:"; gofmt -l .; exit 1; }

      - name: vet
        run: go vet ./...

      # No network and no API key required: the client is tested against
      # httptest servers, so CI never depends on someone's balance.
      - name: test
        run: go test ./... -race -count=1

      # The README's coverage badge is a claim; this is what makes it
      # keep being true.
      - name: coverage gate
        run: make cover-gate

      - name: build
        run: go build ./...

      # `deepseek docs` reads a corpus compiled into the binary. A
      # truncated or unreadable archive breaks it only at runtime, on a
      # released binary, so it is checked here.
      - name: embedded documentation loads
        run: make corpus-check

      # The site's HTML is committed; this catches an edit to the
      # generator that was never regenerated (or the reverse).
      - name: site is up to date with its generator
        run: python3 site/build.py --check

  cross-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true
      - env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -o /dev/null ./cmd/deepseek
