name: Pages

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; never cancel one mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # Full history, because the masthead's release link comes from
      # `git describe --tags` at build time. A shallow, tagless checkout
      # would make the --check step compare against the fallback constant
      # instead of the real tag.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # The HTML is committed so the site is readable in the repo, which
      # only works if it matches the generator. This is what keeps them
      # from drifting apart.
      - name: site is up to date with its generator
        run: python3 site/build.py --check

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
