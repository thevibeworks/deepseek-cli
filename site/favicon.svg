<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="deepseek-cli">
  <!-- The sounding fluke: the tail a whale lifts as it dives, which is
       the one gesture that means "seeking the deep". The same mark rides
       the masthead rule on every page; waves.test.js pins the two to the
       MARK path waves.js exports, because nobody reviews a favicon. The
       blade runs from DeepSeek's official blue (#4D6BFE) into this
       site's cyan (#00c2e9) — family, not a copy. -->
  <defs>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4D6BFE"/>
      <stop offset="1" stop-color="#00c2e9"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="6" fill="#000"/>
  <path d="M2 25.5 Q6 24 10 25 T18 25 T26 25 T34 25" fill="none"
        stroke="#00a2c4" stroke-width="1.6" opacity="0.85"/>
  <path d="M5.6 8.2C4 7 2.4 7.6 3.3 9.5C5.2 13.7 8.7 17.8 12.1 20.7C13.3 21.8 14.1 23.3 14.6 24.9C15.2 23.5 16 22.8 17 22.4C18.1 22.7 19.1 23.5 19.9 24.6C20.7 22.9 21.6 21.2 23 19.5C25.4 16.5 27.9 13.6 29.2 10.5C30 8.5 28.4 7.5 26.7 8.7C23 11.4 19.3 14.9 16.9 18.4C14.3 14.7 9.9 10.5 5.6 8.2Z" fill="url(#b)"/>
</svg>
