<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="deepseek-cli">
  <!-- The same whale the site's sea paints (waves.js WHALE.body, pinned by
       waves.test.js), on the night the dark theme shows: stars over black
       water, the spine just breaking the surface. The body runs from
       DeepSeek's official blue (#4D6BFE) into this site's cyan (#00c2e9) —
       family, not a copy. -->
